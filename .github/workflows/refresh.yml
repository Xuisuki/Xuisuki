name: refresh profile

# Статистика профиля пересобирается сама: ежедневно и по кнопке.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: build graphics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/build.py

      # GitHub кэширует картинки на своей стороне: без смены адреса читатель
      # увидит вчерашнюю карточку. Метка версии меняет адрес раз в сутки.
      - name: bump cache tag
        run: |
          stamp=$(date -u +%Y%m%d)
          sed -i -E "s/\.svg\?v=[0-9]+/.svg?v=$stamp/g" README.md

      - name: commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet && { echo "без изменений"; exit 0; }
          git commit -m "refresh: activity $(date -u +%Y-%m-%d)"
          git push
