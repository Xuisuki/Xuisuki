<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Xuisuki — full-stack engineer">
<defs>
  <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="48"/></filter>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1.2" cy="1.2" r="1.2" fill="#d5dce4"/>
  </pattern>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
    <stop offset="0" stop-color="#1f2328"/>
    <stop offset=".45" stop-color="#1f2328"/>
    <stop offset=".62" stop-color="#0f9f96"/>
    <stop offset=".8" stop-color="#6d5ce8"/>
    <stop offset="1" stop-color="#1f2328"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="orb" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#57606a" stop-opacity=".05"/>
    <stop offset=".5" stop-color="#57606a" stop-opacity=".55"/>
    <stop offset="1" stop-color="#57606a" stop-opacity=".05"/>
  </linearGradient>
  <radialGradient id="core" cx="40%" cy="36%" r="70%">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
    <stop offset=".25" stop-color="#0f9f96"/>
    <stop offset=".75" stop-color="#6d5ce8"/>
    <stop offset="1" stop-color="#6d5ce8" stop-opacity=".2"/>
  </radialGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fbfcfe" stop-opacity=".92"/>
    <stop offset=".42" stop-color="#fbfcfe" stop-opacity=".7"/>
    <stop offset=".62" stop-color="#fbfcfe" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0f9f96" stop-opacity="0"/>
    <stop offset=".5" stop-color="#0f9f96"/>
    <stop offset="1" stop-color="#6d5ce8" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="card"><rect x="1" y="1" width="898" height="318" rx="18"/></clipPath>
</defs>
<style>
  .t { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif; } .m { font-family:ui-monospace,'SF Mono','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace; }
  .rise { opacity:0; animation:rise .9s cubic-bezier(.2,.7,.3,1) forwards; }
  @keyframes rise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
  .sys { opacity:0; animation:fadein 1.6s ease .25s forwards; }
  @keyframes fadein { to { opacity:1; } }
  .core { transform-box:fill-box; transform-origin:center; animation:pulse 5s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.07); } }
  .bar { animation:slide 4.2s ease-in-out infinite; }
  @keyframes slide { 0%,100% { transform:translateX(0); } 50% { transform:translateX(120px); } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
<g clip-path="url(#card)">
  <rect width="900" height="320" fill="#fbfcfe"/>
  <g filter="url(#blur)">
    <circle cx="640" cy="70" r="150" fill="#6d5ce8" opacity=".26"><animateTransform attributeName="transform" type="translate" values="0 0;-90 50;30 90;0 0" dur="24s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/></circle>
    <circle cx="820" cy="250" r="160" fill="#2f7de1" opacity=".26"><animateTransform attributeName="transform" type="translate" values="0 0;-60 -70;-140 10;0 0" dur="28s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/></circle>
    <circle cx="470" cy="280" r="120" fill="#0f9f96" opacity=".26"><animateTransform attributeName="transform" type="translate" values="0 0;90 -40;20 -90;0 0" dur="21s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/></circle>
    <circle cx="880" cy="40" r="90" fill="#d61f7a" opacity="0.156"><animateTransform attributeName="transform" type="translate" values="0 0;-50 60;-10 20;0 0" dur="19s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/></circle>
  </g>
  <rect width="900" height="320" fill="url(#dots)" opacity=".55"/>
  <circle cx="480" cy="20" r="0.70" fill="#1f2328"><animate attributeName="opacity" values=".08;.7;.08" dur="3s" begin="0.00s" repeatCount="indefinite"/></circle><circle cx="577" cy="73" r="1.05" fill="#1f2328"><animate attributeName="opacity" values=".08;.7;.08" dur="4s" begin="0.37s" repeatCount="indefinite"/></circle><circle cx="674" cy="126" r="1.40" fill="#1f2328"><animate attributeName="opacity" values=".08;.7;.08" dur="5s" begin="0.74s" repeatCount="indefinite"/></circle><circle cx="771" cy="179" r="0.70" fill="#1f2328"><animate attributeName="opacity" values=".08;.7;.08" dur="6s" begin="1.11s" repeatCount="indefinite"/></circle><circle cx="868" cy="232" r="1.05" fill="#1f2328"><animate attributeName="opacity" values=".08;.7;.08" dur="7s" begin="1.48s" repeatCount="indefinite"/></circle><circle cx="555" cy="285" r="1.40" fill="#1f2328"><animate attributeName="opacity" values=".08;.7;.08" dur="3s" begin="1.85s" repeatCount="indefinite"/></circle><circle cx="652" cy="58" r="0.70" fill="#1f2328"><animate attributeName="opacity" values=".08;.7;.08" dur="4s" begin="2.22s" repeatCount="indefinite"/></circle><circle cx="749" cy="111" r="1.05" fill="#1f2328"><animate attributeName="opacity" values=".08;.7;.08" dur="5s" begin="2.59s" repeatCount="indefinite"/></circle><circle cx="846" cy="164" r="1.40" fill="#1f2328"><animate attributeName="opacity" values=".08;.7;.08" dur="6s" begin="2.96s" repeatCount="indefinite"/></circle><circle cx="533" cy="217" r="0.70" fill="#1f2328"><animate attributeName="opacity" values=".08;.7;.08" dur="7s" begin="3.33s" repeatCount="indefinite"/></circle><circle cx="630" cy="270" r="1.05" fill="#1f2328"><animate attributeName="opacity" values=".08;.7;.08" dur="3s" begin="3.70s" repeatCount="indefinite"/></circle><circle cx="727" cy="43" r="1.40" fill="#1f2328"><animate attributeName="opacity" values=".08;.7;.08" dur="4s" begin="0.07s" repeatCount="indefinite"/></circle><circle cx="824" cy="96" r="0.70" fill="#1f2328"><animate attributeName="opacity" values=".08;.7;.08" dur="5s" begin="0.44s" repeatCount="indefinite"/></circle><circle cx="511" cy="149" r="1.05" fill="#1f2328"><animate attributeName="opacity" values=".08;.7;.08" dur="6s" begin="0.81s" repeatCount="indefinite"/></circle><circle cx="608" cy="202" r="1.40" fill="#1f2328"><animate attributeName="opacity" values=".08;.7;.08" dur="7s" begin="1.18s" repeatCount="indefinite"/></circle><circle cx="705" cy="255" r="0.70" fill="#1f2328"><animate attributeName="opacity" values=".08;.7;.08" dur="3s" begin="1.55s" repeatCount="indefinite"/></circle><circle cx="802" cy="28" r="1.05" fill="#1f2328"><animate attributeName="opacity" values=".08;.7;.08" dur="4s" begin="1.92s" repeatCount="indefinite"/></circle><circle cx="489" cy="81" r="1.40" fill="#1f2328"><animate attributeName="opacity" values=".08;.7;.08" dur="5s" begin="2.29s" repeatCount="indefinite"/></circle><circle cx="586" cy="134" r="0.70" fill="#1f2328"><animate attributeName="opacity" values=".08;.7;.08" dur="6s" begin="2.66s" repeatCount="indefinite"/></circle><circle cx="683" cy="187" r="1.05" fill="#1f2328"><animate attributeName="opacity" values=".08;.7;.08" dur="7s" begin="3.03s" repeatCount="indefinite"/></circle><circle cx="780" cy="240" r="1.40" fill="#1f2328"><animate attributeName="opacity" values=".08;.7;.08" dur="3s" begin="3.40s" repeatCount="indefinite"/></circle><circle cx="877" cy="293" r="0.70" fill="#1f2328"><animate attributeName="opacity" values=".08;.7;.08" dur="4s" begin="3.77s" repeatCount="indefinite"/></circle><circle cx="564" cy="66" r="1.05" fill="#1f2328"><animate attributeName="opacity" values=".08;.7;.08" dur="5s" begin="0.14s" repeatCount="indefinite"/></circle><circle cx="661" cy="119" r="1.40" fill="#1f2328"><animate attributeName="opacity" values=".08;.7;.08" dur="6s" begin="0.51s" repeatCount="indefinite"/></circle><circle cx="758" cy="172" r="0.70" fill="#1f2328"><animate attributeName="opacity" values=".08;.7;.08" dur="7s" begin="0.88s" repeatCount="indefinite"/></circle><circle cx="855" cy="225" r="1.05" fill="#1f2328"><animate attributeName="opacity" values=".08;.7;.08" dur="3s" begin="1.25s" repeatCount="indefinite"/></circle><circle cx="542" cy="278" r="1.40" fill="#1f2328"><animate attributeName="opacity" values=".08;.7;.08" dur="4s" begin="1.62s" repeatCount="indefinite"/></circle><circle cx="639" cy="51" r="0.70" fill="#1f2328"><animate attributeName="opacity" values=".08;.7;.08" dur="5s" begin="1.99s" repeatCount="indefinite"/></circle><circle cx="736" cy="104" r="1.05" fill="#1f2328"><animate attributeName="opacity" values=".08;.7;.08" dur="6s" begin="2.36s" repeatCount="indefinite"/></circle><circle cx="833" cy="157" r="1.40" fill="#1f2328"><animate attributeName="opacity" values=".08;.7;.08" dur="7s" begin="2.73s" repeatCount="indefinite"/></circle><circle cx="520" cy="210" r="0.70" fill="#1f2328"><animate attributeName="opacity" values=".08;.7;.08" dur="3s" begin="3.10s" repeatCount="indefinite"/></circle><circle cx="617" cy="263" r="1.05" fill="#1f2328"><animate attributeName="opacity" values=".08;.7;.08" dur="4s" begin="3.47s" repeatCount="indefinite"/></circle><circle cx="714" cy="36" r="1.40" fill="#1f2328"><animate attributeName="opacity" values=".08;.7;.08" dur="5s" begin="3.84s" repeatCount="indefinite"/></circle><circle cx="811" cy="89" r="0.70" fill="#1f2328"><animate attributeName="opacity" values=".08;.7;.08" dur="6s" begin="0.21s" repeatCount="indefinite"/></circle>
  <g class="sys">
    <circle cx="705" cy="160" r="70" fill="#0f9f96" opacity=".25" filter="url(#soft)"/>
    <circle class="core" cx="705" cy="160" r="30" fill="url(#core)"/>
    <g transform="rotate(-14 705 160)"><ellipse cx="705" cy="160" rx="182" ry="54" fill="none" stroke="url(#orb)" stroke-width="1.1"/><g><circle r="12.600000000000001" fill="#2f7de1" opacity=".22" filter="url(#soft)"/><circle r="4.2" fill="#2f7de1"/><animateMotion dur="11s" begin="-0.0s" repeatCount="indefinite" path="M523,160 a182,54 0 1,0 364,0 a182,54 0 1,0 -364,0"/></g></g><g transform="rotate(22 705 160)"><ellipse cx="705" cy="160" rx="136" ry="38" fill="none" stroke="url(#orb)" stroke-width="1.1"/><g><circle r="15" fill="#d61f7a" opacity=".22" filter="url(#soft)"/><circle r="5" fill="#d61f7a"/><animateMotion dur="8s" begin="-2.3s" repeatCount="indefinite" path="M569,160 a136,38 0 1,0 272,0 a136,38 0 1,0 -272,0"/></g></g><g transform="rotate(4 705 160)"><ellipse cx="705" cy="160" rx="228" ry="70" fill="none" stroke="url(#orb)" stroke-width="1.1"/><g><circle r="13.799999999999999" fill="#a87606" opacity=".22" filter="url(#soft)"/><circle r="4.6" fill="#a87606"/><animateMotion dur="15s" begin="-4.6s" repeatCount="indefinite" path="M477,160 a228,70 0 1,0 456,0 a228,70 0 1,0 -456,0"/></g></g>
  </g>
  <rect width="900" height="320" fill="url(#fade)"/>
  <rect width="900" height="320" filter="url(#grain)" opacity=".035"/>

  <g class="rise" style="animation-delay:.05s">
    <text class="m" x="56" y="78" fill="#57606a" font-size="11.5" letter-spacing="3.4">FULL-STACK ENGINEER · BACKEND · PRODUCT</text>
  </g>
  <g class="rise" style="animation-delay:.16s">
    <text class="t" x="52" y="152" fill="url(#name)" font-size="70" font-weight="800" letter-spacing="-2.4">Xuisuki</text>
  </g>
  <g class="rise" style="animation-delay:.28s">
    <rect x="56" y="172" width="150" height="2" rx="1" fill="#d5dce4"/>
    <rect class="bar" x="56" y="172" width="30" height="2" rx="1" fill="url(#sweep)"/>
  </g>
  <g class="rise" style="animation-delay:.4s">
    <text class="t" x="56" y="210" fill="#1f2328" font-size="18" opacity=".95">I design and ship products end to end —</text>
    <text class="t" x="56" y="236" fill="#1f2328" font-size="18" opacity=".95">from the database to the button a customer taps.</text>
  </g>
  <g class="rise" style="animation-delay:.52s">
    <text class="m" x="56" y="272" fill="#57606a" font-size="12.5" letter-spacing=".4">Go · TypeScript · Python · Kotlin  /  streaming · Telegram commerce · AI tools</text>
  </g>
</g>
<rect x=".5" y=".5" width="899" height="319" rx="18" fill="none" stroke="#d9e0e8"/>
</svg>
