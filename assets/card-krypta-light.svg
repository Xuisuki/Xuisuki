  <g class="rise" style="animation-delay:.26s"><text class="t" x="40" y="146" fill="#57606a" font-size="15">Telegram bot + Mini App that sells subscriptions end to end:</text><text class="t" x="40" y="169" fill="#57606a" font-size="15">Stars, crypto and card payments, trials and referrals,</text><text class="t" x="40" y="192" fill="#57606a" font-size="15">plus its own admin panel for billing, users and nodes.</text></g>
