<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img" aria-label="Krypta — telegram commerce">
<defs>
  <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="48"/></filter>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1.2" cy="1.2" r="1.2" fill="#d5dce4"/>
  </pattern>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fbfcfe" stop-opacity=".95"/>
    <stop offset=".45" stop-color="#fbfcfe" stop-opacity=".75"/>
    <stop offset=".62" stop-color="#fbfcfe" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a87606"/><stop offset="1" stop-color="#a87606" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="vfade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".2" stop-color="#fff"/>
    <stop offset=".8" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <mask id="vmask"><rect width="900" height="270" fill="url(#vfade)"/></mask>
  <clipPath id="card"><rect x="1" y="1" width="898" height="268" rx="18"/></clipPath>
</defs>
<style>
  .t { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif; } .m { font-family:ui-monospace,'SF Mono','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace; }
  .rise { opacity:0; animation:rise .8s cubic-bezier(.2,.7,.3,1) forwards; }
  @keyframes rise { from { opacity:0; transform:translateY(9px); } to { opacity:1; transform:none; } }
  .float { animation:float 6s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
