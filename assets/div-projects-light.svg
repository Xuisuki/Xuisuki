<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 34" width="900" height="34" role="img" aria-label="PROJECTS">
<defs>
  <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0f9f96" stop-opacity=".9"/><stop offset=".5" stop-color="#6d5ce8" stop-opacity=".5"/>
    <stop offset="1" stop-color="#d9e0e8" stop-opacity=".2"/>
  </linearGradient>
</defs>
<style>
  .m { font-family:ui-monospace,'SF Mono','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace; }
  .ln { stroke-dasharray:900; stroke-dashoffset:900; animation:draw 1.6s ease .15s forwards; }
  @keyframes draw { to { stroke-dashoffset:0; } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
<circle cx="5" cy="17" r="4" fill="none" stroke="#0f9f96" stroke-width="1.5"/>
<text class="m" x="18" y="22" fill="#1f2328" font-size="12.5" font-weight="600" letter-spacing="3.4">PROJECTS</text>
<line class="ln" x1="101" y1="17" x2="900" y2="17" stroke="url(#ln)" stroke-width="1.2"/>
<circle r="2.2" cy="17" fill="#0f9f96">
  <animate attributeName="cx" values="101;900" dur="4.5s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;0" dur="4.5s" repeatCount="indefinite"/></circle>
</svg>
