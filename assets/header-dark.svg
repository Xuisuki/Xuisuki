<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="prodX — infrastructure engineer">
<defs>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#cfd8e6" stop-opacity=".18"/>
    <stop offset="70%" stop-color="#cfd8e6" stop-opacity=".04"/>
    <stop offset="100%" stop-color="#cfd8e6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="shade" cx="34%" cy="30%" r="78%">
    <stop offset="0%" stop-color="#131a22" stop-opacity=".9"/>
    <stop offset="100%" stop-color="#0f141b" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
    <path d="M26 0H0v26" fill="none" stroke="#1b222c" stroke-width="1"/>
  </pattern>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#cfd8e6" stop-opacity="0"/>
    <stop offset="50%" stop-color="#cfd8e6" stop-opacity=".95"/>
    <stop offset="100%" stop-color="#cfd8e6" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0f141b"/>
    <stop offset="100%" stop-color="#0f141b" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="card"><rect x="1" y="1" width="898" height="248" rx="16"/></clipPath>
</defs>
<style>
  .t { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif; }
  .m { font-family:ui-monospace,'SF Mono','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace; }
  .rise { opacity:0; animation:rise .9s cubic-bezier(.2,.7,.3,1) forwards; }
  @keyframes rise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
  .pin { animation:breathe 3.6s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity:.5; } 50% { opacity:1; } }
  .globe { opacity:0; animation:fadein 1.4s ease .2s forwards; }
  @keyframes fadein { to { opacity:1; } }
  .bar { animation:slide 4s ease-in-out infinite; }
  @keyframes slide { 0%,100% { transform:translateX(0); } 50% { transform:translateX(146px); } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>

<g clip-path="url(#card)">
  <rect width="900" height="250" fill="#0f141b"/>
  <rect width="900" height="250" fill="url(#grid)"/>
  <circle cx="742" cy="125" r="150" fill="url(#glow)"/>

  <g class="globe">
    <circle cx="742" cy="125" r="92" fill="url(#shade)" stroke="#39424f" stroke-width="1.2"/>
    <ellipse cx="742" cy="67" rx="71.4" ry="22.4" fill="none" stroke="#39424f" stroke-width="1" opacity=".8"/><ellipse cx="742" cy="95" rx="87.0" ry="14.0" fill="none" stroke="#39424f" stroke-width="1" opacity=".8"/><ellipse cx="742" cy="125" rx="92.0" ry="5.0" fill="none" stroke="#39424f" stroke-width="1" opacity=".8"/><ellipse cx="742" cy="155" rx="87.0" ry="14.0" fill="none" stroke="#39424f" stroke-width="1" opacity=".8"/><ellipse cx="742" cy="183" rx="71.4" ry="22.4" fill="none" stroke="#39424f" stroke-width="1" opacity=".8"/>
    <ellipse cx="742" cy="125" rx="92" ry="92" fill="none" stroke="#39424f" stroke-width="1"><animate attributeName="rx" values="92;0;92" dur="18s" begin="-0.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></ellipse><ellipse cx="742" cy="125" rx="92" ry="92" fill="none" stroke="#39424f" stroke-width="1"><animate attributeName="rx" values="92;0;92" dur="18s" begin="-3.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></ellipse><ellipse cx="742" cy="125" rx="92" ry="92" fill="none" stroke="#39424f" stroke-width="1"><animate attributeName="rx" values="92;0;92" dur="18s" begin="-6.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></ellipse><ellipse cx="742" cy="125" rx="92" ry="92" fill="none" stroke="#39424f" stroke-width="1"><animate attributeName="rx" values="92;0;92" dur="18s" begin="-9.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></ellipse><ellipse cx="742" cy="125" rx="92" ry="92" fill="none" stroke="#39424f" stroke-width="1"><animate attributeName="rx" values="92;0;92" dur="18s" begin="-12.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></ellipse><ellipse cx="742" cy="125" rx="92" ry="92" fill="none" stroke="#39424f" stroke-width="1"><animate attributeName="rx" values="92;0;92" dur="18s" begin="-15.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></ellipse>
    <path d="M690,79 Q736,90 786,159" fill="none" stroke="#cfd8e6" stroke-width="1" opacity=".28"/><circle r="2.4" fill="#cfd8e6"><animate attributeName="opacity" values="0;1;1;0" dur="3.4s" begin="0.0s" repeatCount="indefinite"/><animateMotion dur="3.4s" begin="0.0s" repeatCount="indefinite" path="M690,79 Q736,90 786,159"/></circle><path d="M760,63 Q725,74 702,155" fill="none" stroke="#cfd8e6" stroke-width="1" opacity=".28"/><circle r="2.4" fill="#cfd8e6"><animate attributeName="opacity" values="0;1;1;0" dur="3.4s" begin="1.1s" repeatCount="indefinite"/><animateMotion dur="3.4s" begin="1.1s" repeatCount="indefinite" path="M760,63 Q725,74 702,155"/></circle><path d="M728,117 Q736,141 748,187" fill="none" stroke="#cfd8e6" stroke-width="1" opacity=".28"/><circle r="2.4" fill="#cfd8e6"><animate attributeName="opacity" values="0;1;1;0" dur="3.4s" begin="2.2s" repeatCount="indefinite"/><animateMotion dur="3.4s" begin="2.2s" repeatCount="indefinite" path="M728,117 Q736,141 748,187"/></circle>
    <g class="pin" style="animation-delay:0.00s"><circle cx="690" cy="79" r="7" fill="#cfd8e6" opacity=".14"/><circle cx="690" cy="79" r="2.6" fill="#cfd8e6"/></g><g class="pin" style="animation-delay:0.28s"><circle cx="760" cy="63" r="7" fill="#cfd8e6" opacity=".14"/><circle cx="760" cy="63" r="2.6" fill="#cfd8e6"/></g><g class="pin" style="animation-delay:0.56s"><circle cx="808" cy="105" r="7" fill="#cfd8e6" opacity=".14"/><circle cx="808" cy="105" r="2.6" fill="#cfd8e6"/></g><g class="pin" style="animation-delay:0.84s"><circle cx="728" cy="117" r="7" fill="#cfd8e6" opacity=".14"/><circle cx="728" cy="117" r="2.6" fill="#cfd8e6"/></g><g class="pin" style="animation-delay:1.12s"><circle cx="786" cy="159" r="7" fill="#cfd8e6" opacity=".14"/><circle cx="786" cy="159" r="2.6" fill="#cfd8e6"/></g><g class="pin" style="animation-delay:1.40s"><circle cx="702" cy="155" r="7" fill="#cfd8e6" opacity=".14"/><circle cx="702" cy="155" r="2.6" fill="#cfd8e6"/></g><g class="pin" style="animation-delay:1.68s"><circle cx="748" cy="187" r="7" fill="#cfd8e6" opacity=".14"/><circle cx="748" cy="187" r="2.6" fill="#cfd8e6"/></g>
  </g>

  <rect x="0" y="0" width="470" height="250" fill="url(#fade)"/>

  <g class="rise" style="animation-delay:.05s">
    <text class="m" x="56" y="64" fill="#8b949e" font-size="11.5" letter-spacing="3.4">INFRASTRUCTURE · PRIVACY · AUTOMATION</text>
  </g>
  <g class="rise" style="animation-delay:.18s">
    <text class="t" x="54" y="132" fill="#e6edf3" font-size="62" font-weight="700" letter-spacing="-1.6">prodX</text>
  </g>
  <g class="rise" style="animation-delay:.3s">
    <rect x="56" y="150" width="118" height="2" rx="1" fill="#30363d"/>
    <rect class="bar" x="56" y="150" width="40" height="2" rx="1" fill="url(#sweep)"/>
  </g>
  <g class="rise" style="animation-delay:.42s">
    <text class="t" x="56" y="185" fill="#e6edf3" font-size="17" opacity=".93">I build the boring parts that have to keep working</text>
    <text class="t" x="56" y="210" fill="#8b949e" font-size="14.5">VPN platform · Telegram commerce · streaming · self-hosted automation</text>
  </g>
</g>
<rect x=".5" y=".5" width="899" height="249" rx="16" fill="none" stroke="#242c37"/>
</svg>
